name: Firmware CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'server/firmware/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'server/firmware/**'

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 Core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Install Libraries from Registry
        run: |
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install "RTClib"

      - name: Install Extra Libraries (Git)
        run: |
          mkdir -p $HOME/Arduino/libraries
          git clone https://github.com/m-reilly/BfButton.git $HOME/Arduino/libraries/BfButton
          git clone https://github.com/me-no-dev/ESPAsyncTCP.git $HOME/Arduino/libraries/ESPAsyncTCP
          git clone https://github.com/me-no-dev/ESPAsyncWebServer.git $HOME/Arduino/libraries/ESPAsyncWebServer

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 ./server/firmware/serverEspReact/serverEspReact.ino
